[project]
name = "expression-reexpressor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "sympy",
    "mangum",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "black",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
